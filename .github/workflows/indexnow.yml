# Ping IndexNow (Bing / Yandex / Naver / Seznam) with the pages a push changed.
# Runs here, not in the Cloudflare Workers Build, for two reasons:
#   1. Workers Builds clones shallow, so Docusaurus stamps EVERY page's sitemap
#      <lastmod> with the deploy date (measured 2026-09-19: 208 of 270 live URLs
#      say 2026-09-15). A full-depth checkout here gives real per-page dates,
#      which is what scripts/indexnow.mjs selects on.
#   2. The submission must go out after the pages are live, and the deploy
#      command lives in the Cloudflare dashboard, outside this repo. So this job
#      builds the same commit and waits until udctl.com serves exactly the
#      sitemap this build produced. (The main bundle's hash is NOT a deploy
#      signal: the 2026-09-19 push that changed only static files and scripts
#      deployed fine with the bundle name unchanged.)
name: IndexNow

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'blog/**'
      - 'i18n/**'
      - 'src/pages/**'
      - 'docusaurus.config.ts'
      - 'sidebars.ts'

concurrency:
  group: indexnow
  cancel-in-progress: true

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: sitemap <lastmod> comes from git

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Oldest commit date in this push (UTC) -> since
        id: since
        run: |
          BEFORE='${{ github.event.before }}'
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            RANGE='-1 HEAD'   # first push or force-push: only the head commit
          else
            RANGE="$BEFORE..${{ github.sha }}"
          fi
          SINCE=$(TZ=UTC git log --format=%cs $RANGE | sort | head -1)
          [ -n "$SINCE" ] || SINCE=$(TZ=UTC date +%F)
          echo "since=$SINCE" >> "$GITHUB_OUTPUT"
          echo "since=$SINCE (range $RANGE)"

      - run: npm ci
      - run: npm run build

      - name: Wait until udctl.com serves the sitemap this build produced
        run: |
          for i in $(seq 1 40); do
            if curl -fsS https://udctl.com/sitemap.xml -o live-sitemap.xml && cmp -s live-sitemap.xml build/sitemap.xml; then
              echo "deployed: live sitemap matches build/sitemap.xml after $((i*30))s"; exit 0
            fi
            sleep 30
          done
          echo "::warning::live sitemap still differs from this build after 20 min; submitting anyway, Bing will recrawl if a URL 404s"
          diff <(grep -o '<loc>[^<]*' live-sitemap.xml) <(grep -o '<loc>[^<]*' build/sitemap.xml) | head -20 || true

      - name: Submit changed URLs to IndexNow
        run: node scripts/indexnow.mjs --since '${{ steps.since.outputs.since }}' --sitemap build/sitemap.xml --sitemap build/zh-Hans/sitemap.xml
